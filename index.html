<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード生成デモ</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
    label { display: block; margin: 10px 0; }
    input, button { font: inherit; padding: 8px 12px; }
    button { cursor: pointer; }
    #resultPage { display: none; }
    #qrcode { margin: 16px 0; }
    #qrcode img, #qrcode canvas { display: block; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <section id="formPage">
    <h1>QRコード生成デモ</h1>
    <form id="generateForm">
      <label>ニックネーム：<input id="username" value="Yuki" maxlength="30" required></label>
      <label>アバターID：<input id="avatarId" type="number" min="1" max="12" value="3" required></label>
      <label>ゲーム結果：<input id="result" value="Explorer" maxlength="30"></label>
      <button type="submit">QRコードを生成</button>
    </form>
  </section>

  <section id="resultPage">
    <h1>生成されたQRコード</h1>
    <div id="qrcode"></div>
    <h2>QRコードのデータ</h2>
    <pre id="payload"></pre>
    <button id="download" type="button">QRコードをダウンロード</button>
    <button id="back" type="button">戻って再生成</button>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    $("generateForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const data = {
        username: $("username").value.trim(),
        avatarId: Number($("avatarId").value),
        gameResult: $("result").value.trim()
      };

      if (!data.username) {
        alert("ニックネームを入力してください。");
        return;
      }
      if (!Number.isInteger(data.avatarId) || data.avatarId < 1) {
        alert("アバターIDには1以上の整数を入力してください。");
        return;
      }

      $("payload").textContent = JSON.stringify(data, null, 2);
      $("qrcode").innerHTML = "";
      new QRCode($("qrcode"), {
        text: JSON.stringify(data),
        width: 240,
        height: 240,
        correctLevel: QRCode.CorrectLevel.M
      });

      $("formPage").style.display = "none";
      $("resultPage").style.display = "block";
    });

    $("download").addEventListener("click", () => {
      const canvas = $("qrcode").querySelector("canvas");
      const img = $("qrcode").querySelector("img");
      let dataUrl = "";

      if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) {
        alert("QRコードがまだ生成されていません。戻ってもう一度お試しください。");
        return;
      }

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "qr-code.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    $("back").addEventListener("click", () => {
      $("resultPage").style.display = "none";
      $("formPage").style.display = "block";
    });
  </script>
</body>
</html>
